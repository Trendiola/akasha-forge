[package]
name = "akasha-forge"
version = "2.0.0"
description = "Akasha Forge — The Creative Operating System (Desktop)"
authors = ["Akasha Forge"]
edition = "2021"
rust-version = "1.77"

# The library holds the app logic; main.rs is a thin launcher. This layout is
# required by Tauri 2 (mobile targets link the lib) and keeps `run()` testable.
[lib]
name = "akasha_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls avoids a system OpenSSL dependency on Windows for the health poll.
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

# SIGINT for a graceful backend shutdown on Unix (Windows uses TerminateProcess).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
